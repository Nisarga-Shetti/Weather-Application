<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Weather Application</title>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="container">

            <header>
                <h1>Weather App</h1>
                <p>Discover the weather</p>
            </header>

            <div class="search-box">
                <input type="text" id="city"  placeholder="Enter city name">
                <button id="searchbtn">Search</button>
            </div>

            <p id="message"></p>

            <section class="weather-card" id="weathercard">
                <h2 id="cityname">City Name</h2>

                <div class="weather-icon" id="weathericon">
                    🌤️
                </div>

                <h1 id="temperature">°C</h1>
                <p id="description">Weather condition</p>

                <div class="weather-details">
                    <div class="detail">
                        <span>💧</span>
                        <h3 id="humidity">%</h3>
                        <p>Humidity</p>
                    </div>
                    
                    <div class="detail">
                        <span>💨</span>
                        <h3 id="windspeed">km/h</h3>
                        <p>Wind Speed</p>
                    </div>

                    <div class="detail">
                        <span>🌡️</span>
                        <h3 id="feelslike">°C</h3>
                        <p>Feels Like</p>
                    </div>
                </div>
            </section>

            <footer>
                <p>Weather data powered by Open-Meteo</p>
            </footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
